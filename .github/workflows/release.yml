name: Release

# Build artefak siap-pakai saat tag versi (v*) dipush, lalu tempel ke
# GitHub Release. Cakupan: CLI nxdom-php.exe (Node SEA), SDK @nxdom/client
# (tarball), dan extension .dll Windows (dibuild di runner windows-2019
# yang punya MSVC v142 / toolset VS16 — lihat install.md Langkah 1).
# .so (Linux) masih ditempel manual (butuh header PHP/ABI spesifik versi).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Build nxdom-php.exe: butuh dependency di cli/ (esbuild, postject)
      # DAN di cli/compiler/ (acorn, acorn-walk — di-bundle ke dalam .exe).
      - name: Install dependencies (cli)
        working-directory: cli
        run: npm install

      - name: Install dependencies (compiler)
        working-directory: cli/compiler
        run: npm install

      - name: Build nxdom-php.exe
        working-directory: cli
        run: npm run build:exe

      - name: Verifikasi .exe berjalan
        working-directory: cli
        run: .\dist\nxdom-php.exe 2>&1 | Select-Object -First 3

      - uses: actions/upload-artifact@v4
        with:
          name: nxdom-php-exe
          path: cli/dist/nxdom-php.exe
          if-no-files-found: error

  # Build php_nxdom.dll untuk PHP 8.1.31 ZTS/VS16 menggunakan toolset MSVC
  # v142 yang tersedia di runner windows-2019 (windows-latest = 2022 tidak
  # punya v142 — lihat install.md Langkah 1). Menghasilkan .dll dengan ABI
  # API20210902,TS,VS16 (cocok PHP VS16).
  build-dll:
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4

      # PHP SDK (php-sdk-binary-tools) — branch stabil 2.2.0.
      - name: Clone PHP SDK
        shell: cmd
        run: git clone --branch php-sdk-2.2.0 --depth 1 https://github.com/php/php-sdk-binary-tools.git C:\phpsdk

      # php-src tag persis 8.1.31 (target ABI VS16).
      - name: Clone php-src 8.1.31
        shell: cmd
        run: git clone --branch php-8.1.31 --depth 1 https://github.com/php/php-src.git C:\php-src

      # Buat build tree SDK (vs16/x64) lalu pasang source NxDom dari repo.
      - name: Siapkan build tree + source NxDom
        shell: cmd
        run: |
          set PATH=C:\phpsdk\bin;%PATH%
          phpsdk_buildtree.bat phpmaster
          move C:\php-src C:\phpsdk\phpmaster\vs16\x64\php-src
          mkdir C:\phpsdk\phpmaster\vs16\x64\php-src\ext\nxdom
          copy /Y nxdom\src\*.c   C:\phpsdk\phpmaster\vs16\x64\php-src\ext\nxdom\
          copy /Y nxdom\src\*.h   C:\phpsdk\phpmaster\vs16\x64\php-src\ext\nxdom\
          copy /Y nxdom\src\config.w32 C:\phpsdk\phpmaster\vs16\x64\php-src\ext\nxdom\

      # Aktifkan toolset v142 (VS2019 runner menyediakannya) lalu build.
      - name: Build extension (nmake)
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=14.29
          set PATH=C:\phpsdk\bin;%PATH%
          cd /d C:\phpsdk\phpmaster\vs16\x64\php-src
          buildconf.bat
          configure --disable-all --enable-cli --enable-nxdom=shared
          nmake

      # Buktikan .dll termuat oleh php.exe hasil build (bukti ABI cocok).
      - name: Verifikasi .dll termuat
        shell: cmd
        run: |
          C:\phpsdk\phpmaster\vs16\x64\php-src\x64\Release_TS\php.exe -d extension_dir=C:\phpsdk\phpmaster\vs16\x64\php-src\x64\Release_TS -d extension=php_nxdom.dll -m | findstr /i nxdom

      - uses: actions/upload-artifact@v4
        with:
          name: php-nxdom-dll
          path: C:\phpsdk\phpmaster\vs16\x64\php-src\x64\Release_TS\php_nxdom.dll
          if-no-files-found: error

  build-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package @nxdom/client
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/nxdom-js/package.json').version")
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/package"
          cp packages/nxdom-js/package.json "$STAGE/package/"
          cp -r packages/nxdom-js/src "$STAGE/package/"
          tar -czf "nxdom-client-${VERSION}.tgz" -C "$STAGE" package
          echo "SDK_TARBALL=nxdom-client-${VERSION}.tgz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: nxdom-client
          path: nxdom-client-*.tgz
          if-no-files-found: error

  # Build nxdom.so (Linux) via phpize. PHP versi build di-PIN (8.3) supaya
  # ABI yang dihasilkan konsisten & dapat didokumentasikan — .so hanya
  # cocok untuk PHP versi/thread-safety yang sama (lihat install.md).
  build-so:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3']
    steps:
      - uses: actions/checkout@v4

      # phpize + php-config + header PHP dev disediakan setup-php.
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none

      - name: Build nxdom.so
        run: |
          set -euo pipefail
          mkdir -p build-so
          cp nxdom/src/*.c nxdom/src/*.h nxdom/src/config.m4 build-so/
          cd build-so
          phpize
          ./configure --with-php-config="$(which php-config)"
          make

      - name: Verifikasi .so termuat
        run: |
          set -euo pipefail
          php -d extension="$PWD/build-so/modules/nxdom.so" -r 'echo extension_loaded("nxdom") ? "nxdom OK\n" : "GAGAL\n";'
          php -d extension="$PWD/build-so/modules/nxdom.so" -r 'echo nxdom_version(), "\n";'

      - name: Ganti nama sesuai versi PHP
        run: cp build-so/modules/nxdom.so "nxdom-php${{ matrix.php }}.so"

      - uses: actions/upload-artifact@v4
        with:
          name: nxdom-so-php${{ matrix.php }}
          path: nxdom-php${{ matrix.php }}.so
          if-no-files-found: error

  release:
    needs: [build-exe, build-dll, build-so, build-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Daftar artefak
        run: ls -la artifacts

      # Buat Release kalau belum ada (tag mendefinisikan nama), lalu
      # tambahkan SEMUA artefak yang dibangun job-job di atas.
      - name: Buat/perbarui GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "NxDom $TAG" \
                 --notes "Rilis otomatis $TAG. Semua artefak dibangun oleh CI: CLI (\`.exe\`), extension Windows (\`.dll\`, v142/VS16), extension Linux (\`.so\`, PHP 8.3), dan SDK (\`.tgz\`). Lihat install.md untuk detail ABI/versi."
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

